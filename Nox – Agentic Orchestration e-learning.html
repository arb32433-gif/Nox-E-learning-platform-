<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nox – Learn agentic orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--panel:#151515;--line:#262626;--ink:#d8e3d6;--mute:#8b948a;--or:#ff5b35;--mint:#c6dac9;--dark:#0c0c0c;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:28px;letter-spacing:-.04em}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--or);position:relative;flex:none}
.logo i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--bg);transform:translate(9px,-4px) scale(.85)}
.logo small{display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:-4px}
.coll{border-block:1px solid var(--line);padding:16px 0;font-size:13px}
.coll b{display:block;font-size:14px}.coll span{color:var(--mute)}
nav{display:flex;flex-direction:column;gap:4px}
nav p{margin:0 0 6px 10px;color:var(--mute);font-size:12px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:6px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--mute)}
nav button:hover{color:var(--ink)}
nav button[aria-current=page]{background:var(--mint);color:var(--dark);font-weight:700}
nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav em{margin-left:auto;font-style:normal;font-size:12px}
.note{margin-top:auto;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:16px}
.note b{color:var(--ink);display:block;margin-bottom:4px}
.main{min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:18px 44px;font-size:13px;color:var(--mute);flex-wrap:wrap}
header .who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--mint);font-weight:700;font-size:14px}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.link{background:none;border:0;color:var(--or);cursor:pointer;padding:0;font-weight:500}
.linkish{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px 0}
.linkish:hover{color:var(--ink)}
.linkish:disabled{opacity:.35;cursor:default}
main{padding:44px;max-width:1180px}
h1{font-size:clamp(40px,6vw,76px);line-height:.95;letter-spacing:-.045em;font-weight:800;margin:0 0 14px;color:var(--mint)}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--mute);max-width:56ch;margin:0 0 34px;font-size:16px}
.mblock{margin-bottom:40px}
.mdesc{color:var(--mute);margin:0 0 16px;font-size:14px}
.mprog{color:var(--or);font-weight:700;font-size:13px}
.route{border-block:1px solid var(--line);padding:24px 0;margin-bottom:38px}
.route .mname{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.route .mname b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:22px}
.tile{border:0;border-radius:4px;padding:12px 12px;min-height:118px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--or);color:var(--dark)}
.tile.p2{background:var(--mint)}
.tile b{font-size:15px;line-height:1.15;letter-spacing:-.01em}
.tile span{font-size:12px;opacity:.8}
.tile.done{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--mute)}
.tile.next{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 2px,transparent 2px 7px);box-shadow:inset 0 0 0 2px var(--dark),0 0 0 2px var(--or)}
.tile.p2.next{box-shadow:inset 0 0 0 2px var(--dark),0 0 0 2px var(--mint)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:38px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
.stat b{display:block;font-size:44px;line-height:1;letter-spacing:-.04em;color:var(--mint)}
.stat span{color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or)}
.btn{background:var(--or);color:var(--dark);border:0;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.two{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start}
.avbig{width:64px;height:64px;border-radius:50%;background:#1d1d1d;border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--mint);margin-bottom:16px}
input[type=text],input[type=email]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:12px 0}
.hint{color:var(--mute);font-size:13px;margin:0}
.err{color:var(--or);font-size:13px;min-height:20px;margin:0 0 10px}
.rec{list-style:none;margin:0;padding:0}
.rec li{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.rec li:first-child{border-top:0}
.num{font-style:italic;color:var(--mute);width:34px;flex:none}
.rec .t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.rec .t b{display:block;font-weight:500;font-size:16px}
.rec .t b:hover{color:var(--or)}
.rec .t span{color:var(--mute);font-size:13px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--mute);white-space:nowrap}
.chk{width:30px;height:30px;border-radius:50%;border:1px solid var(--mute);background:none;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--dark)}
.chk[aria-pressed=true]{background:var(--or);border-color:var(--or)}
.chk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mission h3{margin:10px 0 6px;font-size:18px;letter-spacing:-.01em}
.mission p{color:var(--mute);margin:0 0 18px;font-size:14px}
.pts{color:var(--or);font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:14px 12px;border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:400;font-size:13px;border-top:0}
tr.me td{color:var(--or);font-weight:700}
.tw{overflow-x:auto}
.lbody{max-width:68ch}
.lbody p{font-size:16px;line-height:1.7;margin:0 0 16px}
.lbody ul{padding-left:20px;margin:0 0 20px}
.lbody li{margin-bottom:6px}
.try{border:1px solid var(--or);border-radius:10px;padding:20px 22px;margin:28px 0}
.try b{color:var(--or)}
.try p{margin:8px 0 0}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:30px}
.navpair{display:flex;gap:22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--mint);color:var(--dark);padding:12px 18px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
.app{grid-template-columns:1fr}
aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:5;background:var(--bg);transform:translateX(-100%);transition:transform .25s}
aside.open{transform:none}
.menu{display:block}
header,main{padding-inline:20px}
.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="logo"><i></i><div>Nox<small>Learn to run AI agents</small></div></div>
  <div class="coll"><b>Agentic Orchestration</b><span>Self-paced · 3 modules · 9 lessons</span></div>
  <nav aria-label="Workspace">
    <p>Your workspace</p>
    <button data-v="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</button>
    <button data-v="lessons"><svg viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>Modules &amp; lessons</button>
    <button data-v="practice"><svg viewBox="0 0 24 24"><path d="M5 21V4m0 0h12l-2 4 2 4H5"/></svg>Practice<em>6</em></button>
    <button data-v="board"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Leaderboard</button>
    <button data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>My profile</button>
  </nav>
  <div class="note"><b>A note on practice</b>Try workflows on sample data first. Only connect real accounts when you’re ready.</div>
</aside>
<div class="main">
  <header>
    <div class="who"><button class="menu" id="menu" aria-label="Open menu">Menu</button><span id="crumb">Agentic Orchestration › Overview</span></div>
    <div class="who"><span>Your personal study space</span><button class="link" id="signin">Sign in</button><div class="av" id="hav">?</div></div>
  </header>
  <main id="view"></main>
</div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const MODS=[
 {t:"Foundations & handoffs",s:"How agents think, use tools and pass work along.",lessons:[
  {t:"Agentic foundations & tool use",s:"What an AI agent is, and how it uses apps for you.",m:20,tag:"Everyone",
   body:"An AI agent is a model that works toward a goal in steps. It reads a request, decides what to do next, uses a tool such as a calendar, a spreadsheet or a search, then checks the result before it continues. The difference from a plain chatbot is that loop: plan, act, check, repeat.",
   ideas:["A tool is any action an agent can take on your behalf.","Work happens in steps, so you can check each one.","Clear goals and limits produce better results than vague ones."],
   try:"Pick a task you repeat each week. Write down the steps you take and the apps you use. Those apps are your agent’s first tools."},
  {t:"Multi-agent handoffs",s:"Passing work between agents without losing context.",m:25,tag:"Everyone",
   body:"Some jobs are too big for one agent. A handoff passes work from one agent to another along with the context it needs. A good handoff carries the goal, what is already finished, and what is still open.",
   ideas:["Each agent should have one clear role.","Context gets lost at handoffs, so write it down.","A router decides which agent receives each request."],
   try:"Write a short brief that a colleague could follow: the goal, what is finished, and what comes next."},
  {t:"Model Context Protocol (MCP)",s:"One standard way to plug your tools into any agent.",m:30,tag:"Builders",
   body:"MCP is an open standard that lets agents connect to tools and data in one consistent way. Instead of custom wiring for every app, a tool describes what it can do once, and any MCP-aware agent can use it.",
   ideas:["A server exposes tools; the agent using them is the client.","Permissions decide what an agent can read or change.","Start with read-only access and widen it later."],
   try:"List three tools you use every day. For each, note what an agent should be allowed to read, and what it should never change."},
  {t:"Supervisor & worker patterns",s:"One agent plans, others do the tasks.",m:25,tag:"Everyone",
   body:"A supervisor agent plans the work and splits it into subtasks. Worker agents each take one piece and report back. The supervisor checks the results and decides what happens next.",
   ideas:["Subtasks should be small enough to check.","The supervisor owns the final answer.","Workers carry out tasks; they don’t set the overall plan."],
   try:"Break a project you have into five subtasks. Which one would you hand to a worker agent first?"}]},
 {t:"Advanced deployment",s:"Keeping agents safe and under your control.",lessons:[
  {t:"Guardrails & AI safety",s:"Keeping agents inside the lines you set.",m:25,tag:"Everyone",p:2,
   body:"Guardrails are rules that keep an agent inside boundaries you set: what it may touch, what it may say, and when it must stop. Good guardrails work before, during and after each step.",
   ideas:["Limit tools to what the task actually needs.","Check outputs before they reach a customer.","Keep a log of actions so mistakes can be traced."],
   try:"Write down three things your agent must never do without asking you first."},
  {t:"Human-in-the-loop",s:"Where you approve, edit or stop an agent.",m:20,tag:"Everyone",p:2,
   body:"Some steps should always wait for a person, such as sending money, publishing a post or messaging a client. A confirmation loop shows you the proposed action so you can approve it, edit it or stop it.",
   ideas:["Approve high-impact actions; automate low-risk ones.","Make each proposal readable in a few seconds.","Track how often you edit proposals to tune the agent."],
   try:"Choose one action in your work that needs approval every time, and one that can run without you."}]},
 {t:"Going further",s:"Memory, testing, and shipping your first workflow.",lessons:[
  {t:"Memory & context",s:"What agents remember, and what they should forget.",m:25,tag:"Builders",p:2,
   body:"Agents can keep notes between sessions, but memory needs managing. Store what helps the next task, and forget what is stale, private or wrong.",
   ideas:["Short-term memory lives inside one conversation.","Long-term memory should be reviewed regularly.","Relevant context usually beats more context."],
   try:"List three facts an agent should remember about your business or studies, and one thing it should forget."},
  {t:"Testing & monitoring",s:"Check results, catch mistakes, track cost.",m:30,tag:"Builders",p:2,
   body:"Before you trust an agent, test it on examples where you already know the right answer. After launch, keep watching results, errors and cost over time.",
   ideas:["Build a small set of realistic test cases.","Watch for silent failures that look like success.","Track cost per task, not just the monthly bill."],
   try:"Write five inputs your agent should handle, and the output you expect for each one."},
  {t:"Ship your first workflow",s:"Build a small agent team for your own work.",m:45,tag:"Everyone",p:2,
   body:"Put it all together: a small agent team that completes one real job from start to finish, with a person approving the key steps. Start with a task you already do by hand.",
   ideas:["Pick one task you repeat.","Run it on sample data before real data.","Review after a week and adjust."],
   try:"Write the workflow in five steps, and mark the step where you want to approve before anything happens."}]}
];
const MISSIONS=[
 {t:"Inbox triage crew",d:"Set up two agents: one sorts email, one drafts replies for you to approve.",pts:120,tag:"Business owners"},
 {t:"Content handoff",d:"Pass a rough brief from a research agent to a writing agent.",pts:100,tag:"Designers"},
 {t:"Booking assistant",d:"Build a supervisor that books, confirms and reminds clients.",pts:150,tag:"VAs"},
 {t:"Study buddy team",d:"Make agents that summarize notes, quiz you and track weak spots.",pts:110,tag:"Students"},
 {t:"Connect a tool with MCP",d:"Link a calendar or spreadsheet so an agent can read it.",pts:160,tag:"Builders"},
 {t:"Add an approval step",d:"Make an agent ask before it sends or spends anything.",pts:90,tag:"Everyone"}];
const BOARD=[["nightowl",1240],["quietfox",1105],["lantern",980],["vela",910],["moth",820],["orbit",760]];

// flatten lessons with ids like "1.2"
const ALL=[];
MODS.forEach((m,mi)=>m.lessons.forEach((l,li)=>{l.id=(mi+1)+"."+(li+1);l.mi=mi;ALL.push(l)}));

let S={name:"",user:"",pending:"",done:[],v:"overview",k:""};
try{const x=JSON.parse(localStorage.getItem("nox-v2")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem("nox-v2",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),V=$("#view");
const isDone=id=>S.done.includes(id);
const pct=()=>Math.round(S.done.length/ALL.length*100);
const modDone=mi=>MODS[mi].lessons.filter(l=>isDone(l.id)).length;
const nextL=()=>ALL.find(l=>!isDone(l.id));
const initial=()=>((S.name||S.user||"?")[0]||"?").toUpperCase();
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),1800)}

function tile(l){const n=nextL();return `<button class="tile ${l.p==2?"p2":""} ${isDone(l.id)?"done":""} ${n&&n.id==l.id?"next":""}" data-open="${l.id}"><span>${l.id}</span><b>${l.t}</b><span>${isDone(l.id)?"Done":l.m+" min"}</span></button>`}

function lessonList(mi){return `<ul class="rec">${MODS[mi].lessons.map(l=>`<li><span class="num">${l.id}</span><button class="t" data-open="${l.id}"><b>${l.t}</b><span>${l.s}</span></button><span class="tag">${l.tag}</span><button class="chk" aria-pressed="${isDone(l.id)}" aria-label="Mark ${l.t} as done" data-toggle="${l.id}">${isDone(l.id)?CHECK:""}</button></li>`).join("")}</ul>`}

const views={
overview(){const n=nextL();return `
<h1>Put AI agents<br>to work for you.</h1>
<p class="lead">Nox teaches you how teams of AI agents get real work done. Plain language, short lessons, and practice that fits your job.</p>
<div class="route">${MODS.map((m,mi)=>`<div class="mblock" style="margin:0 0 22px"><div class="mname"><b>Module ${mi+1} · ${m.t}</b><span class="mprog">${modDone(mi)}/${m.lessons.length} lessons</span></div><div class="tiles">${m.lessons.map(tile).join("")}</div></div>`).join("")}</div>
<div class="stats">
<div class="card stat"><b>${S.done.length}/${ALL.length}</b><span>lessons finished</span><div class="bar"><i style="width:${pct()}%"></i></div></div>
<div class="card stat"><b>${ALL.reduce((a,l)=>a+(isDone(l.id)?0:l.m),0)}</b><span>minutes of lessons left</span></div>
<div class="card"><b style="font-size:18px">${n?"Up next: "+n.t:"All lessons done"}</b><p class="hint" style="margin:6px 0 16px">${n?n.s:"Pick a practice mission to keep going."}</p>${n?`<button class="btn" data-open="${n.id}">Continue learning</button>`:`<button class="btn" data-v="practice">Open practice</button>`}</div></div>`},
lessons(){return MODS.map((m,mi)=>`<section class="mblock"><h2>Module ${mi+1} · ${m.t}</h2><p class="mdesc">${m.s} <span class="mprog">${modDone(mi)}/${m.lessons.length} done</span></p><div class="card">${lessonList(mi)}</div></section>`).join("")},
lesson(){const l=ALL.find(x=>x.id==S.k)||ALL[0],i=ALL.indexOf(l),m=MODS[l.mi];
return `<p class="hint">Module ${l.mi+1} · ${m.t} · Lesson ${l.id} · ${l.m} min</p>
<h1 style="font-size:clamp(36px,5vw,60px);margin-top:10px">${l.t}</h1>
<p class="lead">${l.s}</p>
<div class="lbody"><p>${l.body}</p><p><b>Key ideas</b></p><ul>${l.ideas.map(x=>`<li>${x}</li>`).join("")}</ul>
<div class="try"><b>Try it</b><p>${l.try}</p></div></div>
<div class="bottom"><div class="navpair"><button class="linkish" data-step="-1" ${i==0?"disabled":""}>← Previous</button><button class="linkish" data-step="1" ${i==ALL.length-1?"disabled":""}>Next lesson →</button></div>
<button class="btn ${isDone(l.id)?"alt":""}" data-complete="${l.id}">${isDone(l.id)?"Completed · undo":"Mark as complete"}</button></div>`},
practice(){return `<h1>Practice.</h1><p class="lead">Pick a mission that looks like your own work. Each one uses sample data, so nothing real is touched.</p><div class="grid">${MISSIONS.map((x,i)=>`<div class="card mission"><span class="tag">${x.tag}</span><h3>${x.t}</h3><p>${x.d}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="pts">${x.pts} pts</span><button class="btn alt" data-start="${i}">Start mission</button></div></div>`).join("")}</div>`},
board(){const rows=[...BOARD.map(r=>({n:r[0],p:r[1]})),...(S.name?[{n:S.name,p:S.done.length*100,me:1}]:[])].sort((a,b)=>b.p-a.p);
return `<h1>Leaderboard.</h1><p class="lead">Only callsigns show here. Your email never does.</p><div class="card tw"><table><thead><tr><th>Rank</th><th>Callsign</th><th>Points</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.me?"me":""}"><td>${i+1}</td><td>${r.n}${r.me?" (you)":""}</td><td>${r.p}</td></tr>`).join("")}</tbody></table>${S.name?"":'<p class="hint" style="padding-top:14px">Choose a callsign on your profile to join the board.</p>'}</div>`},
profile(){return `<h1>Your profile.</h1><p class="lead">Your callsign and progress in one place.</p>
<div class="two"><div class="card"><div class="avbig">${initial()}</div><h2>${S.name?"Hi, "+S.name+".":"Choose your callsign."}</h2><p class="hint">Use a name you’re happy to show on the leaderboard.</p>
<input type="text" id="cs" maxlength="16" placeholder="e.g. nightowl" value="${S.name}" aria-label="Callsign"><p class="err" id="err"></p><button class="btn" id="savecs">Save callsign</button>
<p class="hint" style="margin-top:22px">${S.user?"Signed in as "+S.user+".":'<button class="linkish" data-v="signin">Sign in to save progress across devices</button>'}</p></div>
<div class="card"><h2>Your study record</h2><p class="hint">${pct()}% complete</p><div class="bar" style="margin:12px 0 18px"><i style="width:${pct()}%"></i></div>${MODS.map((m,mi)=>`<p class="mprog" style="margin:18px 0 0">Module ${mi+1} · ${m.t}</p>${lessonList(mi)}`).join("")}</div></div>`},
signin(){if(S.user)return `<h1>You’re signed in.</h1><p class="lead">Signed in as ${S.user}. Your email is never shown on the leaderboard.</p><button class="btn alt" id="signout">Sign out</button>`;
 if(S.pending)return `<h1>Check your inbox.</h1><p class="lead">We sent a sign-in link to ${S.pending}. For this demo, open the link below to continue.</p><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><button class="btn" id="demolink">Open sign-in link</button><button class="linkish" id="changeemail">Use a different email</button></div>`;
 return `<h1>Sign in.</h1><p class="lead">Save your progress across devices. We only use your email to send a sign-in link.</p><div class="card" style="max-width:460px"><label class="hint" for="em">Email</label><input type="email" id="em" placeholder="you@example.com"><p class="err" id="err"></p><button class="btn" id="sendlink">Send sign-in link</button></div>`}
};

function go(v,k,keep){if(!views[v])v="overview";const y=window.scrollY;S.v=v;if(k)S.k=k;save();
 V.innerHTML=views[v]();
 const names={overview:"Overview",lessons:"Modules & lessons",practice:"Practice",board:"Leaderboard",profile:"My profile",signin:"Sign in"};
 let crumb="Agentic Orchestration › "+(names[v]||"");
 if(v=="lesson"){const l=ALL.find(x=>x.id==S.k)||ALL[0];crumb="Lessons › Module "+(l.mi+1)+" › "+l.t}
 $("#crumb").textContent=crumb;
 document.querySelectorAll("nav button[data-v]").forEach(b=>b.dataset.v==v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
 $("#hav").textContent=initial();$("#signin").textContent=S.user?"Signed in":"Sign in";
 $("#side").classList.remove("open");
 keep?window.scrollTo(0,y):window.scrollTo(0,0)}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v)return go(b.dataset.v);
 if(b.dataset.open){return go("lesson",b.dataset.open)}
 if(b.dataset.toggle){const id=b.dataset.toggle,k=S.done.indexOf(id);k<0?(S.done.push(id),toast("Lesson done")):S.done.splice(k,1);save();return go(S.v,S.k,true)}
 if(b.dataset.complete){const id=b.dataset.complete,k=S.done.indexOf(id);k<0?(S.done.push(id),toast("Lesson complete")):S.done.splice(k,1);save();return go("lesson",id,true)}
 if(b.dataset.step){const i=ALL.findIndex(x=>x.id==S.k),n=ALL[i+ +b.dataset.step];if(n)go("lesson",n.id);return}
 if(b.dataset.start!==undefined)return toast("“"+MISSIONS[b.dataset.start].t+"” opens in the full version");
 if(b.id=="savecs"){const v=$("#cs").value.trim();if(!/^[A-Za-z0-9_-]{3,16}$/.test(v)){$("#err").textContent="Use 3–16 letters, numbers, - or _ (no spaces).";return}
  S.name=v;save();go("profile");toast("Callsign saved");return}
 if(b.id=="signin")return go(S.user?"profile":"signin");
 if(b.id=="menu")return $("#side").classList.toggle("open");
 if(b.id=="sendlink"){const v=$("#em").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){$("#err").textContent="Enter a valid email address.";return}
  S.pending=v;save();go("signin");return}
 if(b.id=="changeemail"){S.pending="";save();go("signin");return}
 if(b.id=="demolink"){S.user=S.pending;S.pending="";save();go("profile");toast("Signed in");return}
 if(b.id=="signout"){S.user="";save();go("overview");toast("Signed out");return}
});
document.querySelectorAll("nav button[data-v]").forEach(()=>{});
go(S.v&&views[S.v]?S.v:"overview",S.k,false);
</script>
</body>
</html>
